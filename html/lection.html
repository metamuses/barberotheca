<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Barberotheca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/main.css" rel="stylesheet">
</head>

<body class="bg-dark text-white d-flex flex-column min-vh-100">
    <header class="py-3 mb-4 border-bottom border-secondary">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="header-text mb-0"><a href="index.html" class="text-white text-decoration-none">Barberotheca</a>
            </h1>
            <nav class="d-flex align-items-center">
                <a href="documentation.html" class="text-white text-decoration-none me-3">
                    <span class="d-md-none">Info</span>
                    <span class="d-none d-md-inline">Information</span>
                </a>
                <a href="collection.html" class="btn btn-outline-light">Search</a>
            </nav>
        </div>
    </header>
    <div class="container flex-grow-1">
        <div class="row">
            <!-- Main Content: Audio and Transcription -->
            <div class="col-md-8">
                <section id="audio" class="py-5 mb-4 border-bottom border-secondary">
                    <h2>Audio</h2>
                    <p>Audio content placeholder</p>
                </section>

                <section id="transcription" class="py-5 mb-4">
                    <h2>Transcription</h2>

                    <div class="input-group mb-3">
                        <input type="text" id="transcription-search"
                            class="form-control bg-dark border-secondary text-white"
                            placeholder="Search in transcription">
                        <span class="input-group-text bg-dark border-secondary text-white d-none"
                            id="search-counter">0/0</span>
                        <button class="btn btn-outline-secondary text-white" type="button" id="btn-search-prev"
                            title="Previous match"><i class="bi bi-arrow-up"></i></button>
                        <button class="btn btn-outline-secondary text-white" type="button" id="btn-search-next"
                            title="Next match"><i class="bi bi-arrow-down"></i></button>
                        <button class="btn btn-outline-secondary text-white" type="button" id="btn-search-clear"
                            title="Clear search"><i class="bi bi-x-lg"></i></button>
                    </div>

                    <div id="transcription-content">
                        <p>Transcription content placeholder</p>
                    </div>

                    <div class="mt-3 text-end">
                        <a id="download-transcript-btn" href="#" class="btn btn-outline-light" download>
                            <i class="bi bi-download me-2"></i>Download Transcription
                        </a>
                    </div>
                </section>
            </div>

            <!-- Sidebar / Aside -->
            <aside class="col-md-4 lesson-sidebar border-secondary py-5">
                <h2>Details</h2>
                <div id="lesson-details-content">
                    <!-- Details Card will be injected here -->
                </div>

                <div id="related-lessons-container" class="d-none">
                    <h3 class="mt-5 mb-3">Related Lessons</h3>
                    <div id="related-lessons-content">
                        <!-- Related cards will be injected here -->
                    </div>
                </div>
            </aside>
        </div>
    </div>
    <footer class="py-3 mt-4 border-top border-secondary">
        <div class="container text-center text-secondary">
            <small>&copy; metamuses a.y. 2025/2026</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1/dist/fuse.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
