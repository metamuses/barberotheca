<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Barberotheca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/main.css" rel="stylesheet">
</head>

<body class="bg-dark text-white d-flex flex-column min-vh-100">
    <header class="py-3 mb-4 border-bottom border-secondary">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="header-text mb-0"><a href="index.html" class="text-white text-decoration-none">Barberotheca</a>
            </h1>
            <nav class="d-flex align-items-center">
                <a href="documentation.html" class="text-white text-decoration-none me-3">
                    <span class="d-md-none">Info</span>
                    <span class="d-none d-md-inline">Information</span>
                </a>
                <a href="collection.html" class="btn btn-outline-light">Search</a>
            </nav>
        </div>
    </header>
    <div class="container flex-grow-1">
        <div class="container flex-grow-1 py-5">
            <div class="row">
                <!-- Top Controls -->
                <div class="col-12 mb-4">
                    <!-- Search Section -->
                    <section id="search" class="mb-5">
                        <div class="input-group input-group-lg">
                            <input type="text" id="search-input"
                                class="form-control bg-dark text-white border-secondary border-end-0"
                                placeholder="Search lessons">
                            <button class="btn border-secondary text-white border-start-0" type="button"
                                id="clear-search">
                                <i class="bi bi-x-lg"></i>
                            </button>
                            <button class="btn btn-outline-light" type="button" id="btn-search">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </section>

                    <!-- Refine Search Section -->
                    <section id="refine" class="mb-5">
                        <h2 class="mb-3">Refine Search</h2>
                        <div class="bg-secondary bg-opacity-10 p-3 rounded border border-secondary">
                            <div class="form-check mb-2">
                                <input class="form-check-input bg-dark border-secondary" type="checkbox" value="all"
                                    id="check-all" checked>
                                <label class="form-check-label" for="check-all">All fields</label>
                            </div>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input bg-dark border-secondary search-field"
                                        type="checkbox" value="lectio_title" id="check-title" checked>
                                    <label class="form-check-label" for="check-title">Title</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input bg-dark border-secondary search-field"
                                        type="checkbox" value="keywords" id="check-keywords" checked>
                                    <label class="form-check-label" for="check-keywords">Keywords</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input bg-dark border-secondary search-field"
                                        type="checkbox" value="entities" id="check-entities" checked>
                                    <label class="form-check-label" for="check-entities">Entities</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input bg-dark border-secondary search-field"
                                        type="checkbox" value="semantic_filename" id="check-filename" checked>
                                    <label class="form-check-label" for="check-filename">Filename</label>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Filter Section -->
                    <section id="filters" class="mb-5">
                        <h2 class="mb-3">Filter by</h2>
                        <div class="accordion" id="filterAccordion">
                            <div class="row g-4">
                                <!-- Time Filter -->
                                <div class="col-md-4">
                                    <div class="accordion-item bg-dark border-secondary">
                                        <h2 class="accordion-header" id="headingEvent">
                                            <button class="accordion-button collapsed bg-dark text-white shadow-none"
                                                type="button" data-bs-toggle="collapse" data-bs-target="#collapseEvent"
                                                aria-expanded="false" aria-controls="collapseEvent">
                                                Time
                                            </button>
                                        </h2>
                                        <div id="collapseEvent" class="accordion-collapse collapse"
                                            aria-labelledby="headingEvent">
                                            <div class="accordion-body text-white" id="event-filters">
                                                <!-- Populated by JS -->
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Person Filter -->
                                <div class="col-md-4">
                                    <div class="accordion-item bg-dark border-secondary">
                                        <h2 class="accordion-header" id="headingPerson">
                                            <button class="accordion-button collapsed bg-dark text-white shadow-none"
                                                type="button" data-bs-toggle="collapse" data-bs-target="#collapsePerson"
                                                aria-expanded="false" aria-controls="collapsePerson">
                                                Person
                                            </button>
                                        </h2>
                                        <div id="collapsePerson" class="accordion-collapse collapse"
                                            aria-labelledby="headingPerson">
                                            <div class="accordion-body text-white">
                                                <small class="text-muted">Extracting persons...</small>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Geo Filter -->
                                <div class="col-md-4">
                                    <div class="accordion-item bg-dark border-secondary">
                                        <h2 class="accordion-header" id="headingGeo">
                                            <button class="accordion-button collapsed bg-dark text-white shadow-none"
                                                type="button" data-bs-toggle="collapse" data-bs-target="#collapseGeo"
                                                aria-expanded="false" aria-controls="collapseGeo">
                                                Geo
                                            </button>
                                        </h2>
                                        <div id="collapseGeo" class="accordion-collapse collapse"
                                            aria-labelledby="headingGeo">
                                            <div class="accordion-body text-white">
                                                <small class="text-muted">Extracting locations...</small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Results -->
                <div class="col-12">
                    <section id="collection" class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="mb-0">Collection</h2>
                            <span id="result-count" class="text-muted small">Loading...</span>
                        </div>
                        <div id="results" class="row g-4"></div>
                    </section>
                </div>
            </div>
        </div>
        <footer class="py-3 mt-4 border-top border-secondary">
            <div class="container text-center text-secondary">
                <small>&copy; metamuses a.y. 2025/2026</small>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1/dist/fuse.min.js"></script>
        <script src="js/main.js"></script>
</body>

</html>
