<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barberotheca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="css/main.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="icon" type="image/png" href="logo/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="logo/favicon/favicon.svg" />
  <link rel="shortcut icon" href="logo/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="logo/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="logo/favicon/site.webmanifest" />
</head>

<body class="bg-dark text-white d-flex flex-column min-vh-100">
  <header class="py-3 mb-4 border-bottom border-secondary">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="header-text mb-0 d-flex align-items-baseline">
        <a href="index.html" class="header-logo-link me-3">
          <img src="logo/header_logo.svg" class="header-logo" alt="Barberotheca Logo">
        </a>
        <a href="index.html" class="text-white text-decoration-none">Barberotheca</a>
      </h1>
      <nav class="d-flex align-items-center">
        <a href="documentation.html" class="text-white text-decoration-none me-3">
          <span class="d-md-none">Info</span>
          <span class="d-none d-md-inline">Informazioni</span>
        </a>
        <a href="collection.html" class="btn btn-outline-light">Cerca</a>
      </nav>
    </div>
  </header>
  <div class="container flex-grow-1">
    <!-- Search Section -->
    <section id="search" class="py-5 mb-4 border-bottom border-secondary">
      <h2>Ricerca</h2>
      <div class="input-group input-group-lg">
        <input type="text" id="landing-search-input"
          class="form-control bg-dark text-white border-secondary border-end-0" placeholder="Search lessons">
        <button class="btn btn-outline-secondary border-secondary text-white border-start-0" type="button"
          id="landing-clear-search">
          <i class="bi bi-x-lg"></i>
        </button>
        <button class="btn btn-outline-light" type="button" id="landing-btn-search">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </section>

    <!-- Keywords Section -->
    <section id="keywords" class="py-5 mb-4 border-bottom border-secondary">
      <h2 class="mb-3">Parole chiave</h2>
      <div id="keyword-cloud-container"
        class="d-flex flex-wrap justify-content-center align-items-center gap-2 p-3 rounded border border-secondary bg-dark"
        style="min-height: 200px;">
        <span class="text-secondary">Caricamento parole chiave...</span>
      </div>
    </section>

    <!-- Geo Section -->
    <section id="geo" class="py-5 mb-4 border-bottom border-secondary">
      <h2>Luoghi</h2>
      <div id="map" class="rounded border border-secondary" style="height: 500px; width: 100%;"></div>
    </section>

    <!-- Person Section -->
    <section id="person" class="py-5 mb-4 position-relative">
      <h2 class="mb-3">Persone</h2>

      <!-- Carousel Wrapper with Side Buttons -->
      <div class="position-relative px-0 px-md-5">

        <!-- Prev Button -->
        <button id="btn-prev"
          class="btn btn-dark border-secondary rounded-circle position-absolute top-50 start-0 translate-middle-y z-2 ms-2 shadow carousel-nav-btn"
          type="button" aria-label="Previous">
          <i class="bi bi-chevron-left"></i>
        </button>

        <!-- Scroll Container -->
        <div id="people-scroll-container" class="d-flex overflow-auto gap-3 pb-3 people-carousel"
          style="scroll-behavior: smooth;">
          <div class="text-secondary small">Caricamento persone...</div>
        </div>

        <!-- Next Button -->
        <button id="btn-next"
          class="btn btn-dark border-secondary rounded-circle position-absolute top-50 end-0 translate-middle-y z-2 me-2 shadow carousel-nav-btn"
          type="button" aria-label="Next">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>

      <!-- Pagination Dots -->
      <div id="people-pagination" class="d-none d-md-flex justify-content-center flex-wrap gap-2 mt-2"></div>
    </section>
  </div>
  <footer class="py-3 mt-4 border-top border-secondary">
    <div class="container text-center text-secondary">
      <small>&copy; metamuses a.y. 2025/2026</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1/dist/fuse.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/main.js"></script>
</body>

</html>
